info:
  name: Old Session Acknowledgement
  type: http
  seq: 13

http:
  method: post
  url: http://127.0.0.1:8080/messages/{{messageId}}/ack
  headers:
    - name: Authorization
      value: Bearer {{OldTokenReciever}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Returns 401", function () {
          expect(res.getStatus()).to.equal(401);
        });
        test("Checks the response", function () {
          expect(res.getBody().code).to.equal("INVALID_SESSION");
        });

settings:
  encodeUrl: false
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  The previous token cannot acknowledge a message after reconnect. This error is expected.
  Expected status: 401.
