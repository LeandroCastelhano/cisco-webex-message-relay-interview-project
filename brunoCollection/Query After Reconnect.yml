info:
  name: Query After Reconnect
  type: http
  seq: 12

http:
  method: get
  url: http://127.0.0.1:8080/messages?limit=10
  headers:
    - name: Authorization
      value: Bearer {{TokenReciever}}
  params:
    - name: limit
      value: "10"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Returns 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("Checks the response", function () {
          expect(res.getBody().length).to.equal(2);
          expect(res.getBody()[0].id).to.equal(bru.getVar("messageId"));
          expect(res.getBody()[1].id).to.equal(bru.getVar("offlineMessageId"));
        });

settings:
  encodeUrl: false
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Both messages should remain in order: the previously read message, then the offline message.
  Expected status: 200.
