info:
  name: Query With Disconnected Token
  type: http
  seq: 10

http:
  method: get
  url: http://127.0.0.1:8080/messages
  headers:
    - name: Authorization
      value: Bearer {{TokenReciever}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Returns 401", function () {
          expect(res.getStatus()).to.equal(401);
        });
        test("Checks the response", function () {
          expect(res.getBody().code).to.equal("INVALID_SESSION");
        });

settings:
  encodeUrl: false
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

