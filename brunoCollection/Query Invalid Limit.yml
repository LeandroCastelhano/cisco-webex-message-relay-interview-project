info:
  name: Query Invalid Limit
  type: http
  seq: 24

http:
  method: get
  url: http://127.0.0.1:8080/messages?limit=0
  headers:
    - name: Authorization
      value: Bearer {{TokenReciever}}
  params:
    - name: limit
      value: "0"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Returns 400", function () {
          expect(res.getStatus()).to.equal(400);
        });
        test("Checks the response", function () {
          expect(res.getBody().code).to.equal("INVALID_INPUT");
        });

settings:
  encodeUrl: false
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  A zero poll limit is rejected. This error is expected.
  Expected status: 400.
