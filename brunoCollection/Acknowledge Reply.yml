info:
  name: Acknowledge Reply
  type: http
  seq: 20

http:
  method: post
  url: http://127.0.0.1:8080/messages/{{replyMessageId}}/ack
  headers:
    - name: Authorization
      value: Bearer {{TokenSender}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Returns 204", function () {
          expect(res.getStatus()).to.equal(204);
        });

settings:
  encodeUrl: false
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Maya acknowledges Caroline's reply.
  Expected status: 204.
