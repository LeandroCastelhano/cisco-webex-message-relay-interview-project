info:
  name: Repeat Acknowledgement
  type: http
  seq: 15

http:
  method: post
  url: http://127.0.0.1:8080/messages/{{messageId}}/ack
  headers:
    - name: Authorization
      value: Bearer {{TokenReciever}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Returns 404", function () {
          expect(res.getStatus()).to.equal(404);
        });
        test("Checks the response", function () {
          expect(res.getBody().code).to.equal("UNKNOWN_MESSAGE");
        });

settings:
  encodeUrl: false
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  The first message has already been removed. This error is expected.
  Expected status: 404.
