info:
  name: Message Offline Reciever
  type: http
  seq: 9

http:
  method: post
  url: http://127.0.0.1:8080/messages
  headers:
    - name: Authorization
      value: Bearer {{TokenSender}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "recipient": "Caroline",
        "body": "Message sent while offline"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 202) {
          bru.setVar("offlineMessageId", res.getBody().id);
        }
    - type: tests
      code: |-
        test("Returns 202", function () {
          expect(res.getStatus()).to.equal(202);
        });
        test("Checks the response", function () {
          expect(res.getBody().id === bru.getVar("messageId")).to.equal(false);
        });

settings:
  encodeUrl: false
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Send another message while Caroline is offline and save offlineMessageId separately.
  Expected status: 202.
