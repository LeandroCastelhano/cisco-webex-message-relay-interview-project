info:
  name: Send a Message
  type: http
  seq: 4

http:
  method: post
  url: http://127.0.0.1:8080/messages
  headers:
    - name: Authorization
      value: Bearer {{TokenSender}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "recipient": "Caroline",
        "body": "Hello Caroline, How are you? Ps. Maya"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 202) {
          bru.setVar("messageId", res.getBody().id);
        }
    - type: tests
      code: |-
        test("Returns 202", function () {
          expect(res.getStatus()).to.equal(202);
        });
        test("Checks the response", function () {
          expect(res.getBody().from).to.equal("Maya");
          expect(res.getBody().to).to.equal("Caroline");
        });

settings:
  encodeUrl: false
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Send Maya's message and save messageId. Leave it unacknowledged until after reconnect.
  Expected status: 202.
