info:
  name: Send Empty Message
  type: http
  seq: 23

http:
  method: post
  url: http://127.0.0.1:8080/messages
  headers:
    - name: Authorization
      value: Bearer {{TokenSender}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "recipient": "Caroline",
        "body": ""
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Returns 400", function () {
          expect(res.getStatus()).to.equal(400);
        });
        test("Checks the response", function () {
          expect(res.getBody().code).to.equal("INVALID_INPUT");
        });

settings:
  encodeUrl: false
  timeout: 5000
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  An empty message body is rejected. This error is expected.
  Expected status: 400.
